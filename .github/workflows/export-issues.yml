name: Export All NeuByte Issues (PSV)

on:
  workflow_dispatch:   # manual run

jobs:
  export:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install GitHub CLI
        run: |
          type -p curl >/dev/null || sudo apt install curl -y
          curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg | sudo dd of=/usr/share/keyrings/githubcli-archive-keyring.gpg
          sudo chmod go+r /usr/share/keyrings/githubcli-archive-keyring.gpg
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" | sudo tee /etc/apt/sources.list.d/github-cli.list > /dev/null
          sudo apt update
          sudo apt install gh -y

      - name: Authenticate GitHub CLI
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | gh auth login --with-token

      - name: Export all issues across NeuByte Technologies (JSON)
        run: |
          gh search issues --owner NeuByteTechnologies \
            --json number,title,body,labels,repository,createdAt,updatedAt,url \
            --limit 1000 > all-issues.json

      - name: Convert JSON to PSV
        run: |
          jq -r '
            .[] |
            [
              .repository,
              .number,
              (.title | gsub("\n"; " ")),
              (.body | gsub("\n"; " ") | gsub("\""; "'\"'")),
              (.labels | map(.name) | join(";")),
              .createdAt,
              .updatedAt,
              .url
            ] |
            join("|")
          ' all-issues.json > all-issues.psv

      - name: Upload PSV artifact
        uses: actions/upload-artifact@v4
        with:
          name: neubyte-issues-psv
          path: all-issues.psv
