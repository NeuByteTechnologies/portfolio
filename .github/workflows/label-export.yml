name: Export All NeuByte Labels (PSV)

on:
  workflow_dispatch: # manual run only

permissions:
  contents: read

jobs:
  export-labels:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install GitHub CLI
        run: |
          type -p curl >/dev/null || sudo apt install curl -y
          curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg \
            | sudo dd of=/usr/share/keyrings/githubcli-archive-keyring.gpg
          sudo chmod go+r /usr/share/keyrings/githubcli-archive-keyring.gpg
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] \
            https://cli.github.com/packages stable main" \
            | sudo tee /etc/apt/sources.list.d/github-cli.list > /dev/null
          sudo apt update
          sudo apt install gh jq -y

      - name: Authenticate GitHub CLI
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | gh auth login --with-token

      - name: Export labels from all NeuByte repos (JSON)
        run: |
          repos=$(gh repo list NeuByteTechnologies --json name --jq '.[].name')

          echo "[" > all-labels.json
          first=true

          for repo in $repos; do
            echo "Exporting labels for $repo..."
            labels=$(gh api repos/NeuByteTechnologies/$repo/labels)

            if [ "$first" = true ]; then
              first=false
            else
              echo "," >> all-labels.json
            fi

            echo "{ \"repository\": \"$repo\", \"labels\": $labels }" >> all-labels.json
          done

          echo "]" >> all-labels.json

      - name: Convert JSON to PSV (flattened)
        run: |
          jq -r '
            .[] as $repo |
            $repo.labels[]? |
            [
              $repo.repository,
              .name,
              .color,
              (.description // ""),
              (.archived // false),
              (.archived_at // ""),
              (.archived_by // "")
            ]
            | map(tostring)
            | join("|")
          ' all-labels.json > all-labels.psv

      - name: Upload PSV artifact
        uses: actions/upload-artifact@v4
        with:
          name: neubyte-labels-psv
          path: all-labels.psv
