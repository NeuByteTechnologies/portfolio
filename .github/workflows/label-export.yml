name: Export All NeuByte Labels (JSON)

on:
  workflow_dispatch:   # manual run

jobs:
  export-labels:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install GitHub CLI
        run: |
          type -p curl >/dev/null || sudo apt install curl -y
          curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg | sudo dd of=/usr/share/keyrings/githubcli-archive-keyring.gpg
          sudo chmod go+r /usr/share/keyrings/githubcli-archive-keyring.gpg
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" \
            | sudo tee /etc/apt/sources.list.d/github-cli.list > /dev/null
          sudo apt update
          sudo apt install gh -y

      - name: Authenticate GitHub CLI
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | gh auth login --with-token

      - name: Export labels from all NeuByte repos
        run: |
          # List of all NeuByte repos
          repos=(
            "architecture"
            "portfolio"
            "router"
            "standards"
            "fitness-api"
            "fitness-web"
            "resume-system"
            "data-engineering"
            "design-system"
            "routing"
            "admin"
            "assets"
            "documentation"
            "diagrams"
            "infrastructure"
          )

          echo "[" > all-labels.json

          first=true
          for repo in "${repos[@]}"; do
            echo "Exporting labels for $repo..."

            # Fetch labels via GitHub API
            labels=$(gh api repos/NeuByteTechnologies/$repo/labels)

            # Add comma between repo blocks
            if [ "$first" = true ]; then
              first=false
            else
              echo "," >> all-labels.json
            fi

            # Write repo block
            echo "{ \"repository\": \"$repo\", \"labels\": $labels }" >> all-labels.json
          done

          echo "]" >> all-labels.json

      - name: Upload Labels Artifact
        uses: actions/upload-artifact@v4
        with:
          name: neubyte-labels-json
          path: all-labels.json
