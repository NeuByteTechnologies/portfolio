portfolio_overview:
  title: Portfolio Overview
  paragraphs:
  - "The NeuByte Fitness App Portfolio is a full\u2011cycle engineering project designed\
    \ to demonstrate system design, documentation, architecture, UI/UX planning, and\
    \ modern development practices. It showcases how I approach building maintainable,\
    \ scalable systems with clarity, structure, and strong visual grammar."
project_summary:
  title: Project Summary
  paragraphs:
  - "The Fitness App is a comprehensive system for tracking workouts, nutrition, progress,\
    \ and analytics. It is inspired by my own multi\u2011year fitness journey and\
    \ long\u2011term use of platforms like Fitbit and Samsung Health."
  bullet_points:
  - "Enterprise\u2011grade documentation"
  - Lean architecture and system design
  - UI/UX specification and workflow modeling
  - API design and backend planning
  - "Azure\u2011hosted data and integration patterns"
  - "GitHub\u2011based project management and pipelines"
why_this_project:
  title: Why This Project
  paragraphs:
  - My experience with fitness tracking apps over the past eight years made this the
    perfect domain for a portfolio project.
  bullet_points:
  - Data modeling
  - API design
  - UI/UX flows
  - Reporting and analytics
  - Cloud architecture
  - "Real\u2011world user behavior"
  closing: This allows me to demonstrate a complete engineering lifecycle from concept
    to documentation to implementation.
tech_stack:
  title: Tech Stack Overview
  backend:
    title: Backend & APIs
    items:
    - Python (API layer)
    - Azure App Services
    - RESTful API design
    - Authentication & MFA flows
    - Database
    - "Azure MySQL (cost\u2011optimized for portfolio use)"
    - Data dictionary & schema documentation
    - Star schema for reporting models
  frontend:
    title: Frontend
    items:
    - Modern Web UI
    - Lightweight components
    - Minimal JavaScript footprint
    - Razor / C# backend support
  reporting:
    title: Reporting
    items:
    - Power BI
    - Azure Pipelines for scheduled refresh
    - "OLTP \u2192 Star Schema transformation"
  devops:
    title: Tooling & DevOps
    items:
    - GitHub Projects
    - GitHub Issues
    - GitHub Source Control
    - "Markdown\u2011based documentation"
    - UML & diagramming (Inkscape, Draw.io)
